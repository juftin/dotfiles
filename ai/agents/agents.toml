version = 1
agents = ["claude", "codex"]

####################################################
# Skills
####################################################

[[skills]]
name = "*"
source = "juftin/spec-kit"

[[skills]]
name = "add-community-extension"
source = "juftin/spec-kit"
path = ".github/skills/add-community-extension"

[[skills]]
name = "code-review"
source = "juftin/spec-kit"
path = ".github/skills/code-review"

[[skills]]
name = "find-skills"
source = "vercel-labs/skills"
path = "skills/find-skills"

####################################################
# MCP Servers
####################################################

[[mcp]]
name = "context7"
url = "https://mcp.context7.com/mcp"
owner = "context7"
targets = ["claude", "codex"]

[[mcp]]
name = "github"
url = "https://api.githubcopilot.com/mcp/"
headers = { Authorization = "Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}" }
owner = "github"
targets = ["claude", "codex"]

[[mcp]]
name = "serena"
owner = "serena"
targets = ["claude", "codex"]

[[mcp]]
name = "slack"
owner = "slack"
targets = ["claude", "codex"]

####################################################
# Plugins
####################################################

[[plugins]]
name = "astral"
source = "astral-sh/claude-code-plugins"
path = "plugins/astral"
targets = ["claude", "codex"]

[[plugins]]
name = "juftin"
source = "juftin/skills"
targets = ["claude", "codex"]

[[plugins]]
name = "skill-creator"
source = "anthropics/claude-plugins-official"
path = "plugins/skill-creator"
targets = ["claude", "codex"]

[[plugins]]
name = "code-review"
source = "anthropics/claude-plugins-official"
path = "plugins/code-review"
targets = ["claude", "codex"]

[[plugins]]
name = "commit-commands"
source = "anthropics/claude-plugins-official"
path = "plugins/commit-commands"
targets = ["claude", "codex"]

[[plugins]]
name = "pr-review-toolkit"
source = "anthropics/claude-plugins-official"
path = "plugins/pr-review-toolkit"
targets = ["claude", "codex"]

[[plugins]]
name = "context7"
source = "anthropics/claude-plugins-official"
installer = "native"
claude = "context7@claude-plugins-official"
codex = "context7@claude-plugins-official"
targets = ["claude", "codex"]

[[plugins]]
name = "github"
source = "anthropics/claude-plugins-official"
installer = "native"
claude = "github@claude-plugins-official"
codex = "github@claude-plugins-official"
targets = ["claude", "codex"]

[[plugins]]
name = "serena"
source = "anthropics/claude-plugins-official"
installer = "native"
claude = "serena@claude-plugins-official"
codex = "serena@claude-plugins-official"
targets = ["claude", "codex"]

[[plugins]]
name = "slack"
source = "anthropics/claude-plugins-official"
installer = "native"
claude = "slack@claude-plugins-official"
codex = "slack@claude-plugins-official"
targets = ["claude", "codex"]

[[plugins]]
