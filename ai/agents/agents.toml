version = 1
agents = ["claude", "codex", "antigravity"]

####################################################
# Skills
####################################################

[[skills]]
name = "*"
source = "juftin/spec-kit"

[[skills]]
name = "find-skills"
source = "vercel-labs/skills"
path = "skills/find-skills"

####################################################
# MCP Servers
####################################################

[[mcp]]
name = "context7"
url = "https://mcp.context7.com/mcp"
owner = { claude = "context7", codex = "context7", antigravity = "global" }
targets = ["claude", "codex", "antigravity"]

[[mcp]]
name = "github"
url = "https://api.githubcopilot.com/mcp/"
headers = { Authorization = "Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}" }
owner = { claude = "github", codex = "github", antigravity = "global" }
targets = ["claude", "codex", "antigravity"]

####################################################
# Plugins
####################################################

[[plugins]]
name = "astral"
source = "astral-sh/claude-code-plugins"
path = "plugins/astral"
targets = ["claude", "codex", "antigravity"]

[[plugins]]
name = "juftin"
source = "juftin/skills"
targets = ["claude", "codex", "antigravity"]

[[plugins]]
name = "skill-creator"
source = "anthropics/claude-plugins-official"
path = "plugins/skill-creator"
targets = ["claude", "codex", "antigravity"]

[[plugins]]
name = "context7"
source = "anthropics/claude-plugins-official"
installer = "native"
claude = "context7@claude-plugins-official"
codex = "context7@claude-plugins-official"
targets = ["claude", "codex", "antigravity"]

[[plugins]]
name = "github"
source = "anthropics/claude-plugins-official"
installer = "native"
claude = "github@claude-plugins-official"
codex = "github@claude-plugins-official"
targets = ["claude", "codex", "antigravity"]
