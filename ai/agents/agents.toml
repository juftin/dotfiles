version = 1
agents = ["claude", "codex"]

####################################################
# Skills
####################################################

[[skills]]
name = "unslop"
source = "theclaymethod/unslop"

[[skills]]
name = "*"
source = "juftin/spec-kit"
path = "skills"

[[skills]]
name = "*"
source = "path:private"

####################################################
# MCP Servers
####################################################

[[mcp]]
name = "context7"
url = "https://mcp.context7.com/mcp"

[[mcp]]
name = "github"
url = "https://api.githubcopilot.com/mcp/"
headers = { Authorization = "Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}" }

[[mcp]]
name = "atlassian"
url = "https://mcp.atlassian.com/v2/mcp"
owner = { claude = "atlassian", codex = "atlassian" }

[[mcp]]
name = "notion"
url = "https://mcp.notion.com/mcp"
owner = { claude = "notion", codex = "notion" }

[[mcp]]
name = "slack"
owner = { claude = "slack", codex = "slack-connector" }
targets = ["claude", "codex"]

[[mcp]]
name = "datadog"
owner = "ced"
targets = ["claude", "codex"]

[[mcp]]
name = "serena"
owner = "ced"
targets = ["claude", "codex"]

####################################################
# Plugins
####################################################

[[plugins]]
name = "astral"
source = "astral-sh/claude-code-plugins"
path = "plugins/astral"
targets = ["claude", "codex"]

[[plugins]]
name = "atlassian"
source = "atlassian/atlassian-mcp-server"
targets = ["claude", "codex"]

[[plugins]]
name = "juftin"
source = "juftin/skills"
targets = ["claude", "codex"]

[[plugins]]
name = "pup"
source = "DataDog/pup"
targets = ["claude", "codex"]

[[plugins]]
name = "ced"
source = "git:git@github.com:smarterdx/ced-claude-plugin-poc.git"
targets = ["claude", "codex"]

[[plugins]]
name = "skill-creator"
source = "anthropics/claude-plugins-official"
path = "plugins/skill-creator"
targets = ["claude"]

[[plugins]]
name = "slack"
source = "slackapi/slack-skills-plugin"
installer = "native"
claude = "slack@slack"
codex = "slack@slack"
targets = ["claude", "codex"]

[[plugins]]
name = "slack-connector"
installer = "native"
codex = "slack@openai-api-curated"
targets = ["codex"]

[[plugins]]
name = "notion"
source = "makenotion/claude-code-notion-plugin"
installer = "native"
claude = "notion-workspace-plugin@notion-plugin-marketplace"
codex = "notion@openai-api-curated"
targets = ["claude", "codex"]

[[plugins]]
name = "typescript-lsp"
source = "anthropics/claude-plugins-official"
installer = "native"
claude = "typescript-lsp@claude-plugins-official"
targets = ["claude"]
